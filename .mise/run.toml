[backlog-browser]
description = "Start the backlog browser web interface for visual task management"
run = "mise exec -- backlog browser"

[build]
description = "Compile the crate"
run = "cargo check --workspace"

[fmt]
description = "Format Rust sources"
run = "cargo fmt"

[fmt-check]
description = "Check Rust formatting without changing files"
run = "cargo fmt --check"

[check]
description = "Type-check the crate with warnings denied"
env = { CARGO_TARGET_DIR = "{{config_root}}/../target/quality", RUSTFLAGS = "-D warnings" }
run = "cargo check --workspace"

[clippy]
description = "Lint all targets with warnings denied"
env = { CARGO_TARGET_DIR = "{{config_root}}/../target/quality" }
run = "cargo clippy --all-targets -- -D warnings"

[test]
description = "Run the workspace test suite"
run = "cargo nextest run --workspace"

[quality]
description = "Run formatting, compile, clippy, and test checks"
run = "bash .mise/scripts/quality.sh"

[serve]
description = "Serve the lab agent over A2A and MCP"
run = "cargo run --bin a2a-lab-sdk-example"

[a2a-lab]
description = "Call a2a-lab log, metric, and workflow operations"
run = "cargo run --bin a2a-lab --"

[simulator-setup]
description = "Clone Opentrons v10.0.0 and install robot-server dependencies"
run = "bash .mise/scripts/simulator-setup.sh"

[simulator]
description = "Run the pinned OT-2 robot-server simulator on 127.0.0.1:31950"
run = "bash .mise/scripts/simulator.sh"

[simulator-health]
description = "Check robot-server /health"
run = "bash .mise/scripts/simulator-health.sh"

[simulator-clean]
description = "Remove the cached Opentrons checkout"
run = "bash .mise/scripts/simulator-clean.sh"
