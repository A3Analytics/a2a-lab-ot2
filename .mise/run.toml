[backlog-browser]
description = "Start the backlog browser web interface for visual task management"
run = "mise exec -- backlog browser"

[build]
description = "Compile the crate"
run = "cargo check --workspace"

[build-linux-x86_64]
description = "Build the release binary for x86-64 Linux in Docker"
run = "bash .mise/scripts/build-linux-x86_64.sh"

[fmt]
description = "Format Rust sources"
run = "cargo fmt"

[fmt-check]
description = "Check Rust formatting without changing files"
run = "cargo fmt --check"

[check]
description = "Type-check the crate with warnings denied"
env = { CARGO_TARGET_DIR = "{{config_root}}/../target/quality", RUSTFLAGS = "-D warnings" }
run = "cargo check --workspace"

[clippy]
description = "Lint all targets with warnings denied"
env = { CARGO_TARGET_DIR = "{{config_root}}/../target/quality" }
run = "cargo clippy --all-targets -- -D warnings"

[test]
description = "Run the workspace test suite"
run = "cargo nextest run --workspace"

[quality]
description = "Run formatting, compile, clippy, and test checks"
run = "bash .mise/scripts/quality.sh"

[compliance]
description = "Validate deterministic OT-2 behavior over A2A and MCP"
run = "bash .mise/scripts/compliance.sh"

[start]
description = "Run a2a-lab-ot2 (A2A, MCP, and SiLA when no subcommand is given)"
run = "cargo run --bin a2a-lab-ot2 --"

[a2a-lab-ot2]
description = "Call a2a-lab operations against the OT-2 HTTP API"
run = "cargo run --bin a2a-lab-ot2 --"

[a2a-lab-ot2-example]
description = "Print advertised log sources as one OTEL log stream"
run = "bash .mise/scripts/a2a-lab-ot2-example.sh"

[images]
description = "List camera sources, or save one current JPEG"
run = "bash .mise/scripts/images.sh"

[ot2-simulator-setup]
description = "Build the pinned OT-2 robot-server Docker image (Opentrons v10.0.0)"
run = "bash .mise/scripts/ot2-simulator-setup.sh"

[ot2-simulator]
description = "Run the OT-2 robot-server simulator container on 127.0.0.1:31950"
run = "bash .mise/scripts/ot2-simulator.sh"

[ot2-simulator-health]
description = "Check robot-server /health"
run = "bash .mise/scripts/ot2-simulator-health.sh"

[ot2-simulator-clean]
description = "Remove the simulator container, image, and leftover host checkout"
run = "bash .mise/scripts/ot2-simulator-clean.sh"

[smoke]
description = "Live smoke test: OT-2 simulator, A2A, MCP, and Bedrock conversations"
run = "bash .mise/scripts/smoke.sh"

[agent-image]
description = "Build and verify the agent image for one architecture"
run = "bash .mise/scripts/agent-image.sh build"

[agent-image-all]
description = "Build and verify linux/amd64 and linux/arm64 agent images"
run = "bash .mise/scripts/agent-image.sh build all"

[agent-image-verify]
description = "Verify a built agent image without a camera"
run = "bash .mise/scripts/agent-image.sh verify"

[agent-image-verify-all]
description = "Verify linux/amd64 and linux/arm64 agent images without a camera"
run = "bash .mise/scripts/agent-image.sh verify all"

[agent-run]
description = "Run the agent image with explicit device access"
run = "bash .mise/scripts/agent-run.sh"

[agent-stop]
description = "Remove the agent container"
run = "bash .mise/scripts/agent-stop.sh"

[agent-media-smoke]
description = "Opt-in dual-source media smoke; skipped unless A2ALAB_MEDIA_SMOKE=1"
run = "bash .mise/scripts/agent-media-smoke.sh"

[agent-media-smoke-native]
description = "Opt-in native-serve media smoke; requires A2ALAB_MEDIA_SMOKE_NATIVE=1"
run = "bash .mise/scripts/agent-media-smoke-native.sh"

[agent-orbbec-live]
description = "Opt-in live Orbbec JPEG check; skipped unless A2ALAB_ORBBEC_LIVE=1"
run = "bash .mise/scripts/agent-orbbec-live.sh"
