name: Build binaries

on:
  workflow_call:
    inputs:
      targets:
        description: JSON matrix of target, runner, and libc
        required: true
        type: string

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    steps:
      - name: Checkout a2a-lab-ot2
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: a2a-lab-ot2

      - name: Require the tag to match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: a2a-lab-ot2
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$tag" != "$version" ]]; then
            printf 'tag %s does not match Cargo.toml version %s\n' "$tag" "$version" >&2
            exit 1
          fi

      - name: Install Rust
        if: matrix.libc != 'musl'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
          targets: "${{ matrix.target }},wasm32-unknown-unknown"

      - name: Build
        if: matrix.libc != 'musl'
        working-directory: a2a-lab-ot2
        run: |
          set -euo pipefail
          cargo build --locked --release --bin a2a-lab-ot2 --target '${{ matrix.target }}'

      - name: Build with native musl C and C++ tools
        if: matrix.libc == 'musl'
        working-directory: a2a-lab-ot2
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace \
            --env TARGET --env 'RUSTFLAGS=-C target-feature=+crt-static' \
            --env 'CXXSTDLIB=static=stdc++' \
            rust:1.98.1-alpine@sha256:7cc1c22d77d9432f7fe012a70e6d3e555af54c2a6832700ed7d553f1769ae89f \
            sh -ec 'apk add --no-cache build-base clang-dev git linux-headers perl pkgconf
              rustup target add "$TARGET" wasm32-unknown-unknown
              cargo build --locked --release --bin a2a-lab-ot2 --target "$TARGET"'

      - name: Smoke-test and package
        id: package
        working-directory: a2a-lab-ot2
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          target='${{ matrix.target }}'
          built="target/${target}/release/a2a-lab-ot2"
          asset="a2a-lab-ot2-${version}-${target}"
          "$built" --help >/dev/null
          version_text="$("$built" --version)"
          printf '%s\n' "$version_text"
          case "$version_text" in
            "a2a-lab-ot2 ${version}") ;;
            *)
              printf 'unexpected version output: %s\n' "$version_text" >&2
              exit 1
              ;;
          esac
          case '${{ matrix.libc }}' in
            musl)
              ldd_text="$(ldd "$built" 2>&1 || true)"
              printf '%s\n' "$ldd_text"
              case "$ldd_text" in
                *"not a dynamic executable"*|*"statically linked"*) ;;
                *)
                  printf 'musl binary is dynamically linked\n' >&2
                  exit 1
                  ;;
              esac
              ;;
            gnu)
              ldd_text="$(ldd "$built" 2>&1 || true)"
              printf '%s\n' "$ldd_text"
              case "$ldd_text" in
                *libc.so*) ;;
                *)
                  printf 'glibc binary is not linked to libc\n' >&2
                  exit 1
                  ;;
              esac
              ;;
            darwin)
              link_text="$(otool -L "$built")"
              printf '%s\n' "$link_text"
              case "$link_text" in
                *libSystem*) ;;
                *)
                  printf 'darwin binary is not linked to libSystem\n' >&2
                  exit 1
                  ;;
              esac
              ;;
          esac
          cp "$built" "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.package.outputs.asset }}
          path: a2a-lab-ot2/${{ steps.package.outputs.asset }}
          if-no-files-found: error
