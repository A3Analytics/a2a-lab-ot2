[package]
name = "a2a-lab-ot2"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Example lab agent wrapping an Opentrons OT-2 robot-server simulator"
publish = false
default-run = "a2a-lab-ot2"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
type_complexity = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
a2a-lab-dev-kit = { path = "../a2a-lab-dev-kit-rs", default-features = false, features = [
    "sila2",
] }
aws-config = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "sso",
] }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = [
    "rt-tokio",
    "default-https-client",
] }
clap = { version = "4.5.53", features = ["derive", "env"] }
jiff = { version = "0.2.37", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
rmcp = { version = "2.2", default-features = false, features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
rig = { version = "0.42", default-features = false, features = [
    "bedrock",
    "agent",
    "rmcp",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "signal",
] }

[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
axum = "0.8.9"
base64 = "0.22.1"
jsonwebtoken = "9.3.1"
rand = "0.8"
rig = { version = "0.42", default-features = false, features = ["test-utils"] }
rsa = { version = "0.9.10", features = ["pem"] }

[[bin]]
name = "a2a-lab-ot2"
path = "src/bin/a2a-lab-ot2.rs"
