[package]
name = "a2a-lab-ot2"
version = "0.2.3"
edition = "2024"
rust-version = "1.98.1"
description = "Example lab agent wrapping an Opentrons OT-2 robot-server simulator"
publish = false
default-run = "a2a-lab-ot2"

[patch.crates-io]
nokhwa-bindings-macos = { git = "https://github.com/l1npengfih/nokhwa", rev = "dd8f26a32de8b1fbe996b7ac870eacf22cad6593" }
nokhwa-core = { git = "https://github.com/l1npengfih/nokhwa", rev = "dd8f26a32de8b1fbe996b7ac870eacf22cad6593" }

[profile.dev.package.openh264]
opt-level = 3

[profile.dev.package.yuv]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
type_complexity = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
a2a-lab-dev-kit = { git = "https://github.com/A3Analytics/a2a-lab-dev-kit-rs", rev = "cc46b6dc112b7455c761ad1abeb24f280d8e4f9e", default-features = false, features = [
    "sila2",
    "web-ui",
    "yuv",
    "openh264",
    "nokhwa",
] }
async-trait = "0.1"
base64 = "0.22.1"
axum = "0.8.9"
aws-config = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "credentials-process",
    "rt-tokio",
    "sso",
] }
aws-credential-types = { version = "1", default-features = false }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = [
    "rt-tokio",
    "default-https-client",
] }
aws-sdk-bedrockagentcore = { version = "1", default-features = false, features = [
    "rt-tokio",
    "default-https-client",
] }
clap = { version = "4.5.53", features = ["derive", "env"] }
futures-util = "0.3.31"
fastembed = { version = "7.7.0", default-features = false, features = [
    "onnx",
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
] }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
] }
yuv = { version = "0.8.20", default-features = false, features = ["sse"] }
openh264 = { version = "0.9.9", features = ["source"] }
jiff = { version = "0.2.37", features = ["serde"] }
libloading = "0.8"
nokhwa = { version = "0.10.11", default-features = false, features = [
    "input-native",
] }
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
rmcp = { version = "2.2", default-features = false, features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
rig = { version = "0.42", default-features = false, features = [
    "bedrock",
    "agent",
    "rmcp",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "signal",
] }

[dev-dependencies]
base64 = "0.22.1"
jsonwebtoken = "9.3.1"
rand = "0.8"
rig = { version = "0.42", default-features = false, features = ["test-utils"] }
rsa = { version = "0.9.10", features = ["pem"] }

[[bin]]
name = "a2a-lab-ot2"
path = "src/bin/a2a-lab-ot2.rs"

[patch."https://github.com/A3Analytics/a2a-lab-dev-kit-rs"]
a2a-lab-dev-kit = { path = "../a2a-lab-dev-kit-rs" }
