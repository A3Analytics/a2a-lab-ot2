[package]
name = "a2a-lab-sdk-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Example lab agent wrapping an Opentrons OT-2 robot-server simulator"
publish = false
default-run = "a2a-lab-ot2"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
type_complexity = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
a2a-lab-sdk = { path = "../a2a-lab-sdk-rs", default-features = false }
clap = { version = "4.5.53", features = ["derive", "env"] }
jiff = { version = "0.2.37", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "signal",
] }

[dev-dependencies]
axum = "0.8.9"

[[bin]]
name = "a2a-lab-ot2"
path = "src/bin/a2a-lab-ot2.rs"
